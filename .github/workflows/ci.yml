# Checks only. Deployment stays with GitHub Pages (legacy, main:/), which this
# workflow neither triggers nor replaces.
name: ci

on:
  pull_request:
    # labeled/unlabeled: the `visual-strict` label switches the visual mode
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  python:
    name: layout, validators, static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git diff --check (base..head)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # DEVLOG.md is stored with CRLF; a CR at end of line is not an error
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git -c core.whitespace=cr-at-eol diff --check "$BASE" HEAD
          else
            echo "no base commit — skipped"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: static site sanity
        run: python tools/check_site_static.py
      - name: generate layout (dry, both targets)
        run: python tools/generate_layout.py --dry
      - name: committed layouts are current
        run: python tools/generate_layout.py --check
      - name: top-down overrides merge
        run: python tools/topdown_layout.py --check
      - name: sprite contact metadata is current
        run: python tools/sprite_contact.py --check
      - name: content points are valid and proto/index.html is current
        run: python tools/build_proto_content.py --check
      - name: camera choreography is valid
        run: python tools/camera_choreography.py --check
      - name: key art is valid, WebPs and proto/index.html current
        run: python tools/key_art.py --check
      - name: layout tests
        run: python tools/test_layout.py
      - name: run rules are enforced
        run: python tools/check_run_rules.py
      - name: foreshortening / pack sharpness report
        run: python tools/measure_foreshortening.py

  journey3:
    name: /next/ builds and matches committed next/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: journey3/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: npm ci
        working-directory: journey3
        run: npm ci
      - name: build
        working-directory: journey3
        run: npm run build
      - name: dist -> next/ (ephemeral workspace)
        run: python tools/build_journey3.py deploy
      - name: next/ is in sync with journey3 source
        run: |
          git diff --stat --exit-code -- next/
          untracked="$(git status --porcelain --untracked-files=all -- next/)"
          if [ -n "$untracked" ]; then
            echo "next/ differs from the build:"; echo "$untracked"; exit 1
          fi

  browser:
    name: browser smoke + visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      # report: pixel changes are measured and published, the job stays green.
      # strict: any change fails — label a PR `visual-strict` for changes that
      # are supposed to be invisible (refactors, tooling, CI).
      VISUAL_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'visual-strict') && 'strict' || 'report' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTEXT: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || 'main' }}
      # named in the Job Summary, so the table says where the pictures are
      VISUAL_ARTIFACT: visual-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || 'main' }}-run${{ github.run_id }}
    defaults:
      run:
        working-directory: tests/browser
    steps:
      # the PR head itself, not the merge commit GitHub builds by default:
      # head and base are then exactly the two commits being compared
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - name: install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: smoke
        run: npx playwright test
      - name: visual runner self-test
        if: always()
        run: node visual.mjs selftest --out ../../out/visual-selftest
      - name: visual — PR base (or push before) -> head
        if: always()
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "no base commit — visual comparison skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node visual.mjs run --base "$BASE_SHA" --head . --mode "$VISUAL_MODE" \
            --out ../../out/visual --smoke ../../out/smoke/results.json \
            --title "visual: base ${BASE_SHA:0:7} -> head ${HEAD_SHA:0:7}"
      - name: visual — production main -> head (stacked PRs)
        if: always() && github.event_name == 'pull_request'
        run: |
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$MAIN_SHA" = "$BASE_SHA" ]; then
            echo "base is main — covered above"; exit 0
          fi
          node visual.mjs run --base "$MAIN_SHA" --head . --mode "$VISUAL_MODE" \
            --out ../../out/visual-vs-main --smoke ../../out/smoke/results.json \
            --title "visual: production main ${MAIN_SHA:0:7} -> head ${HEAD_SHA:0:7}"
      - name: content points review (sheet + copy table)
        if: always()
        run: node content_review.mjs --out ../../out/content-review
      - name: zoom choreography review (15 frames + route strip)
        if: always()
        run: node zoom_review.mjs --out ../../out/zoom-review
      - name: key art review (plain /proto/, real art)
        if: always()
        run: node key_art_review.mjs --out ../../out/key-art-integration
      - name: upload key art review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-art-${{ env.CONTEXT }}-run${{ github.run_id }}
          path: out/key-art-integration
          retention-days: 14
          if-no-files-found: warn
      - name: upload zoom review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-review-${{ env.CONTEXT }}-run${{ github.run_id }}
          path: out/zoom-review
          retention-days: 14
          if-no-files-found: warn
      - name: upload content review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-review-${{ env.CONTEXT }}-run${{ github.run_id }}
          path: out/content-review
          retention-days: 14
          if-no-files-found: warn
      - name: upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ env.CONTEXT }}-run${{ github.run_id }}
          path: |
            out/visual
            out/visual-vs-main
            out/visual-selftest
          retention-days: 14
          if-no-files-found: warn
      - name: upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ env.CONTEXT }}-run${{ github.run_id }}
          path: out/smoke
          retention-days: 14
          if-no-files-found: warn
