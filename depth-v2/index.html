<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fellmise — depth journey preview</title>
<!--
  Превью маршрута. Тот же самый движок, что обслуживает продакшен / и /ru/:
  файлы лежат здесь в одном экземпляре, продакшен-страницы подключают их по
  абсолютным путям. Отличие превью только в том, что язык переключается
  запросом ?lang=ru, а в поиске страница не участвует: canonical ведёт на
  продакшен, noindex не даёт превью конкурировать с корнем.
-->
<link rel="canonical" href="https://fellmise.com/">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="/assets/icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Podkova:wght@700&family=Vollkorn:wght@500&display=swap">
<link rel="stylesheet" href="/depth-v2/depth.css">
<link rel="stylesheet" href="/depth-v2/content.css">
<link rel="stylesheet" href="/depth-v2/chrome.css">
<link rel="stylesheet" href="/depth-v2/static.css">
<script>
  // canonical превью с ?lang=ru ведёт на русский корень, а не на английский
  if (new URLSearchParams(location.search).get('lang') === 'ru')
    document.querySelector('link[rel=canonical]').href = 'https://fellmise.com/ru/';
</script>
</head>
<body>
<!-- Живой маршрут. В статике эти узлы скрыты стилями, а их модули не грузятся. -->
<div id="stage"></div>
<div id="content"></div>
<div id="vignette"></div>
<div id="chill"></div>
<div id="ui"></div>

<!-- Статическая версия: то же содержание без движения, собирается static.js -->
<div id="static" hidden></div>

<div id="debug" hidden></div>

<!-- boot.js решает, какую из двух версий грузить; движок один на / , /ru/ и /depth-v2/ -->
<script type="module" src="/depth-v2/boot.js"></script>
</body>
</html>
